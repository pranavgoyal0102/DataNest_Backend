# Test-profile config so the context can start without real infrastructure.
# H2 stands in for Postgres; the Cloudinary values are placeholders because
# CloudinaryConfig only constructs a client at startup and makes no network call.
# Firebase needs no value here - DatanestBackendApplicationTests overrides both
# Firebase beans, so FirebaseConfig's factory methods never run.

spring.datasource.url=jdbc:h2:mem:datanest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

app.cors.allowed-origins=http://localhost:5173

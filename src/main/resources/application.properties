spring.application.name=datanest-backend

# Firebase service-account JSON, e.g. file:/etc/secrets/firebase.json or classpath:firebase.json.
# Leave blank to use Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS).
firebase.credentials=${FIREBASE_CREDENTIALS:}

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Streaming uploads are pointless if multipart caps them at the 1MB default.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

# Only the health endpoint is exposed; it is the one path the filter chain permits anonymously.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
